name: Julia CI

on:
  push: {branches: [main,master]}
  pull_request: {types: [opened,synchronize,reopened,ready_for_review,converted_to_draft]}
  issue_comment: {types: [created]}
  workflow_dispatch: {inputs: {feature: {type: choice, description: What to run, options: [DocDeploy,LintAndTest,TagBot]}}}

jobs:
  julia-ci:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    with:
      include-all-compatible-minor-versions: true
      include-rc-versions: true
      filter: 'dirname(filename) == joinpath(pwd(), "test")'
      # Stop a test item after 45 minutes; the slowest item takes about 7 minutes on CI.
      # Before the kill, the test process writes the backtraces of all its tasks into the
      # output of the item. Without a limit, an item that blocks keeps the job busy until
      # GitHub cancels it.
      testitem-timeout: '2700'
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
